services:
  # --- CONTAINER 1: POSTGRESQL DATABASE (MULTI-TENANCY READY) ---
  postgres-db:
    image: postgres:16-alpine
    container_name: appandor_postgres
    restart: always
    environment:
      POSTGRES_USER: appandor_admin
      POSTGRES_PASSWORD: EinSicheresDatenbankPasswort123!
      POSTGRES_DB: appandor_universal_inventory
    volumes:
      - ./postgres_data:/var/lib/postgresql/data  # Wieder dein gewohnter, sichtbarer Festplatten-Ordner!
      - ./private_core/init_sql:/docker-entrypoint-initdb.d

  # --- CONTAINER 2: API-FIRST NODE.JS BACKEND ---
  node-app:
    image: node:20-alpine
    container_name: appandor_backend
    working_dir: /usr/src/app
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - SERVER_BRANDING=Microsoft-IIS/10.0
      - SSL_KEY_PATH=/etc/letsencrypt/live/inventory.appandor.de/privkey.pem
      - SSL_CERT_PATH=/etc/letsencrypt/live/inventory.appandor.de/fullchain.pem
      - JWT_SECRET=AppandorSecureCoreSecret2026!!!
      - JWT_EXPIRES_IN=1800
      - DB_HOST=appandor_postgres        
      - DB_USER=appandor_admin
      - DB_PASSWORD=EinSicheresDatenbankPasswort123!
      - DB_NAME=appandor_universal_inventory
      - DB_PORT=5432

    # KORREKTUR: sleep 5 zwingt Node zu warten, bis Postgres die SQL-Dateien vollständig eingelesen hat!
    command: sh -c "sleep 5 && npm install && node server.js"
    volumes:
      - .:/usr/src/app
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./private_core/server_core:/usr/src/app/server_core

    depends_on:
      - postgres-db
